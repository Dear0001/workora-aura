name: CI

on:
  push:
    paths:
      - ".github/workflows/ci.yml"
      - "workora/**"
      - "workora-microservices/**"
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - "workora/**"
      - "workora-microservices/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workora
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: workora/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run TypeScript type check
        run: npm run type-check

  backend:
    name: Backend focused tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workora-microservices
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run focused admin and membership tests
        run: >-
          mvn -B -ntp
          -pl identity-service,organization-service,dashboard-service
          -am
          -Dtest=AdminAccessRequestServiceTest,KeycloakServiceAdminRoleTest,MembershipServiceTest,AdminDashboardAggregationServiceTest,AdminSystemHealthServiceTest,KeycloakRoleAuthoritiesConverterTest
          -Dsurefire.failIfNoSpecifiedTests=false
          test
