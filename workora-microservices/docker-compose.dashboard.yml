services:
  identity-service:
    depends_on: !override
      identity-db:
        condition: service_healthy
      keycloak:
        condition: service_started

  organization-service:
    depends_on: !override
      organization-db:
        condition: service_healthy

  project-service:
    depends_on: !override
      project-db:
        condition: service_healthy

  work-service:
    depends_on: !override
      work-db:
        condition: service_healthy

  bug-service:
    depends_on: !override
      bug-db:
        condition: service_healthy

  recruitment-service:
    depends_on: !override
      recruitment-db:
        condition: service_healthy
