spring:
  datasource:
    url: jdbc:h2:mem:projecttest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

organization-service:
  base-url: http://localhost:9999

management:
  endpoints:
    web:
      exposure:
        include: health,info
