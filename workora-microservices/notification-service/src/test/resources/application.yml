spring:
  datasource:
    url: jdbc:h2:mem:notificationtest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  rabbitmq:
    listener:
      simple:
        auto-startup: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

workora:
  notifications:
    internal-service-token: test-internal-token
