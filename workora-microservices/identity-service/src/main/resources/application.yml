server:
  port: ${IDENTITY_SERVICE_PORT:8101}

storage:
  minio:
    endpoint: ${STORAGE_MINIO_ENDPOINT:http://localhost:9000}
    presign-endpoint: ${STORAGE_MINIO_PRESIGN_ENDPOINT:http://localhost:9000}
    access-key: ${STORAGE_MINIO_ACCESS_KEY:}
    secret-key: ${STORAGE_MINIO_SECRET_KEY:}
    bucket: ${STORAGE_MINIO_BUCKET:workora-files}
    presign-minutes: ${STORAGE_MINIO_PRESIGN_MINUTES:15}

jwt:
  secret: ${JWT_SECRET:}
  access-token-expiration-ms: 900000
  refresh-token-expiration-ms: 604800000

keycloak:
  base-url: ${KEYCLOAK_BASE_URL:http://localhost:8180}
  realm: ${KEYCLOAK_REALM:workora}
  client-id: ${KEYCLOAK_CLIENT_ID:workora-api}
  frontend-url: ${KEYCLOAK_FRONTEND_URL:http://localhost:3000}
  admin-username: ${KEYCLOAK_ADMIN_USERNAME:}
  admin-password: ${KEYCLOAK_ADMIN_PASSWORD:}

registration:
  verification-session-ttl: ${REGISTRATION_VERIFICATION_SESSION_TTL:PT15M}

spring:
  application:
    name: identity-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/identity_db}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:true}
    open-in-view: ${JPA_OPEN_IN_VIEW:false}
    database-platform: ${JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/workora}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/realms/workora/protocol/openid-connect/certs}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS:health,info}
  endpoint:
    health:
      show-details: ${MANAGEMENT_HEALTH_DETAILS:always}

springdoc:
  swagger-ui:
    config-url: ${IDENTITY_SWAGGER_CONFIG_URL:/identify/v3/api-docs/swagger-config}
    url: ${IDENTITY_SWAGGER_URL:/identify/v3/api-docs}
