server:
  port: ${PAYMENT_SERVICE_PORT:8108}

spring:
  application:
    name: payment-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/payment_db}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:true}
    open-in-view: ${JPA_OPEN_IN_VIEW:false}
    database-platform: ${JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/workora}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/realms/workora/protocol/openid-connect/certs}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:}
    password: ${RABBITMQ_PASSWORD:}

workora:
  payment:
    provider: ${PAYMENT_PROVIDER:local}
    bakong:
      base-url: ${BAKONG_BASE_URL:}
      username: ${BAKONG_USERNAME:}
      password: ${BAKONG_PASSWORD:}
      token: ${BAKONG_TOKEN:}
      authentication-path: ${BAKONG_AUTHENTICATION_PATH:/authentication}
      create-transaction-path: ${BAKONG_CREATE_TRANSACTION_PATH:/create-transaction}
      transaction-status-path: ${BAKONG_TRANSACTION_STATUS_PATH:/transaction-status}
      callback-url: ${BAKONG_CALLBACK_URL:}
      callback-secret: ${BAKONG_CALLBACK_SECRET:}
    qr-expiry-minutes: ${PAYMENT_QR_EXPIRY_MINUTES:15}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS:health,info}
  endpoint:
    health:
      show-details: ${MANAGEMENT_HEALTH_DETAILS:always}

springdoc:
  swagger-ui:
    config-url: /payment/v3/api-docs/swagger-config
    url: /payment/v3/api-docs
